name: Consumer rights — content safety gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  approval-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/validate-content.py
      - name: Explicitly block automatic production deployments
        run: echo 'Content integrity check only. No automatic merge, deploy or legal attestation.'
